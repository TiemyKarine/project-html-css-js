
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Sign Up · Kawaii</title>
</head>
<body>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>

<main class="page">
    <div class="card">

        <div class="mascot" aria-hidden="true">
            <svg viewBox="0 0 120 120" class="mascot-svg">
                <circle cx="60" cy="60" r="52" fill="#FFE1EC"/>
                <circle cx="42" cy="55" r="7" fill="#4A2E44"/>
                <circle cx="78" cy="55" r="7" fill="#4A2E44"/>
                <circle cx="44" cy="52" r="2.4" fill="#fff"/>
                <circle cx="80" cy="52" r="2.4" fill="#fff"/>
                <path d="M42 75 Q60 90 78 75" stroke="#4A2E44" stroke-width="4" fill="none" stroke-linecap="round"/>
                <ellipse cx="28" cy="68" rx="8" ry="5" fill="#FFB4CC" opacity="0.8"/>
                <ellipse cx="92" cy="68" rx="8" ry="5" fill="#FFB4CC" opacity="0.8"/>
            </svg>
        </div>

        <h1 class="title">Create your Kawaii account</h1>
        <p class="subtitle">It only takes a minute, promise~</p>

        <form class="signup-form" id="signupForm" novalidate>

            <div class="field">
                <label for="name" class="field-label">Name</label>
                <input type="text" name="name" id="name" class="text-input" placeholder="Your name" required>
                <span class="field-error"> </span>
            </div>

            <div class="field">
                <label for="email" class="field-label">Email</label>
                <input type="email" name="email" id="email" class="text-input" placeholder="you@example.com" required>
                <span class="field-error"></span>
            </div>

            <div class="field">
                <label for="password" class="field-label">Password</label>
                <div class="password-wrap">
                    <input type="password" name="password" id="password" class="text-input" placeholder="Create a password" required minlength="8">
                    <button type="button" class="toggle-visibility" aria-label="Show password">👁️</button>
                </div>
                <div class="strength-meter">
                    <span></span><span></span><span></span>
                </div>
                <span class="field-error"></span>
            </div>

            <div class="field">
                <label for="confirmPassword" class="field-label">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="text-input" placeholder="Type it again" required>
                <span class="field-error" id="confirmError"></span>
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <span>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
            </label>

            <button type="submit" class="signup-btn" id="signupBtn">
                <span class="btn-label">Sign Up</span>
            </button>
        </form>

        <div class="divider"><span>or continue with</span></div>

        <section class="social-login">
            <button type="button" class="social-btn gmail" data-provider="Google">
                Continue with Gmail
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M125.4 128C91.5 128 64 155.5 64 189.4C64 190.3 64 191.1 64.1 192L64 192L64 448C64 483.3 92.7 512 128 512L512 512C547.3 512 576 483.3 576 448L576 192L575.9 192C575.9 191.1 576 190.3 576 189.4C576 155.5 548.5 128 514.6 128L125.4 128zM528 256.3L528 448C528 456.8 520.8 464 512 464L128 464C119.2 464 112 456.8 112 448L112 256.3L266.8 373.7C298.2 397.6 341.7 397.6 373.2 373.7L528 256.3zM112 189.4C112 182 118 176 125.4 176L514.6 176C522 176 528 182 528 189.4C528 193.6 526 197.6 522.7 200.1L344.2 335.5C329.9 346.3 310.1 346.3 295.8 335.5L117.3 200.1C114 197.6 112 193.6 112 189.4z"/></svg>
            </button>
            <button type="button" class="social-btn facebook" data-provider="Facebook">
                Continue with Facebook
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 440 146.7 540.8 258.2 568.5L258.2 398.2L205.4 398.2L205.4 320L258.2 320L258.2 286.3C258.2 199.2 297.6 158.8 383.2 158.8C399.4 158.8 427.4 162 438.9 165.2L438.9 236C432.9 235.4 422.4 235 409.3 235C367.3 235 351.1 250.9 351.1 292.2L351.1 320L434.7 320L420.3 398.2L351 398.2L351 574.1C477.8 558.8 576 450.9 576 320z"/></svg>
            </button>
            <button type="button" class="social-btn instagram" data-provider="Instagram">
                Continue with Instagram
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320.3 205C256.8 204.8 205.2 256.2 205 319.7C204.8 383.2 256.2 434.8 319.7 435C383.2 435.2 434.8 383.8 435 320.3C435.2 256.8 383.8 205.2 320.3 205zM319.7 245.4C360.9 245.2 394.4 278.5 394.6 319.7C394.8 360.9 361.5 394.4 320.3 394.6C279.1 394.8 245.6 361.5 245.4 320.3C245.2 279.1 278.5 245.6 319.7 245.4zM413.1 200.3C413.1 185.5 425.1 173.5 439.9 173.5C454.7 173.5 466.7 185.5 466.7 200.3C466.7 215.1 454.7 227.1 439.9 227.1C425.1 227.1 413.1 215.1 413.1 200.3zM542.8 227.5C541.1 191.6 532.9 159.8 506.6 133.6C480.4 107.4 448.6 99.2 412.7 97.4C375.7 95.3 264.8 95.3 227.8 97.4C192 99.1 160.2 107.3 133.9 133.5C107.6 159.7 99.5 191.5 97.7 227.4C95.6 264.4 95.6 375.3 97.7 412.3C99.4 448.2 107.6 480 133.9 506.2C160.2 532.4 191.9 540.6 227.8 542.4C264.8 544.5 375.7 544.5 412.7 542.4C448.6 540.7 480.4 532.5 506.6 506.2C532.8 480 541 448.2 542.8 412.3C544.9 375.3 544.9 264.5 542.8 227.5zM495 452C487.2 471.6 472.1 486.7 452.4 494.6C422.9 506.3 352.9 503.6 320.3 503.6C287.7 503.6 217.6 506.2 188.2 494.6C168.6 486.8 153.5 471.7 145.6 452C133.9 422.5 136.6 352.5 136.6 319.9C136.6 287.3 134 217.2 145.6 187.8C153.4 168.2 168.5 153.1 188.2 145.2C217.7 133.5 287.7 136.2 320.3 136.2C352.9 136.2 423 133.6 452.4 145.2C472 153 487.1 168.1 495 187.8C506.7 217.3 504 287.3 504 319.9C504 352.5 506.7 422.6 495 452z"/></svg>
            </button>
        </section>

        <p class="account-sign">
            Already have an account? <a href="#">Log In</a>
        </p>
    </div>
</main>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
